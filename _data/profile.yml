short_bio_text_justify: true
short_bio: >-
  <p>
    I am a Ph.D. candidate in Information Systems at the
    <a href="https://bm.hkust.edu.hk/" target="_blank">HKUST Business School</a>,
    advised by Prof. <a href="https://www.google.com/search?q=Yi+Yang+HKUST+ISOM" target="_blank">Yi Yang</a>.
    Before that, I received my M.Phil. in Computer Science and Engineering from HKUST, advised by
    Prof. <a href="https://www.google.com/search?q=Kai+Chen+HKUST+CSE" target="_blank">Kai Chen</a>
    (CSE Department), and my B.Eng. in Software Engineering from Sun Yat-sen University.
  </p>
  <p>
    My research develops trustworthy and knowledge-aware machine learning for real-world data and
    regulatory settings, along two main streams:
    <strong>(1) Relational Graph Learning</strong> &mdash; LLM agents that reason over graphs,
    graph&ndash;LLM co-teaching, and structured representation learning; and
    <strong>(2) Regulatory Machine Learning</strong> &mdash; machine unlearning, patent intelligence,
    and privacy-aware learning for compliance-sensitive applications such as finance and anti-fraud.
    My work has appeared at ICLR, NAACL, and IEEE Transactions on Big Data.
  </p>


{% if site.data.profile.research_interests %}
<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body px-4 pt-3 pb-2">
                <h6 class="mb-2" style="font-size: 0.95rem;"><i class="fas fa-lightbulb"></i> Research Interests</h6>
                {% for grp in site.data.profile.research_interests %}
                <div class="mb-2">
                    <div class="font-weight-bold text-muted mb-1" style="font-size: 0.72rem;">{{ grp.group }}</div>
                    <ul class="list-unstyled mb-0" style="line-height: 1.25;">
                        {% for it in grp.items %}
                        <li class="mb-0">
                            {% if it.url %}
                            <a href="{{ it.url }}" target="_blank" style="color: #007bff; text-decoration: underline; font-size: 0.8rem;">{{ it.name }}</a>
                            {% else %}
                            <span style="font-size: 0.8rem;">{{ it.name }}</span>
                            {% endif %}
                        </li>
                        {% endfor %}
                    </ul>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endif %}

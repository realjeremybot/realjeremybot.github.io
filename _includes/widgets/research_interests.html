{% if site.data.profile.research_interests %}
<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body px-4 pt-4 pb-3">
                <h6 class="mb-3"><i class="fas fa-lightbulb"></i> Research Interests</h6>
                {% for grp in site.data.profile.research_interests %}
                <div class="mb-3">
                    <div class="small font-weight-bold text-muted mb-2">{{ grp.group }}</div>
                    <ul class="list-unstyled mb-0">
                        {% for it in grp.items %}
                        <li class="mb-1">
                            {% if it.url %}
                            <a href="{{ it.url }}" target="_blank" style="color: #007bff; text-decoration: underline;">{{ it.name }}</a>
                            {% else %}
                            {{ it.name }}
                            {% endif %}
                        </li>
                        {% endfor %}
                    </ul>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endif %}

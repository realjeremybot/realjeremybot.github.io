{% if site.data.profile.research_interests %}
<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body px-4 pt-4 pb-3">
                <h6 class="mb-3"><i class="fas fa-lightbulb"></i> Research Interests</h6>
                {% for grp in site.data.profile.research_interests %}
                <div class="mb-3">
                    <div class="small font-weight-bold text-muted mb-2">{{ grp.group }}</div>
                    {% for it in grp.items %}
                    {% if it.url %}
                    <a href="{{ it.url }}" target="_blank"
                       class="badge badge-pill badge-light border mr-1 mb-1 px-2 py-1"
                       style="font-weight: 400; white-space: normal;">{{ it.name }}</a>
                    {% else %}
                    <span class="badge badge-pill badge-light border mr-1 mb-1 px-2 py-1"
                          style="font-weight: 400; white-space: normal;">{{ it.name }}</span>
                    {% endif %}
                    {% endfor %}
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endif %}
